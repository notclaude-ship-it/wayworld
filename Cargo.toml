[package]
name = "wayworld"
version = "0.1.0"
edition = "2021"
description = "Environnement de bureau Wayland sous forme de jeu 3D (apps flottantes, pins au bras, VR)"
license = "MIT"

[dependencies]
smithay = { version = "0.7.0", default-features = false, features = ["wayland_frontend"] }
serde = { version = "1", features = ["derive"] }
bevy = { version = "0.19", features = ["jpeg"] }
serde_json = "1"
bevy_mod_openxr = { version = "0.6", optional = true }
bevy_mod_xr = { version = "0.6", optional = true }
openxr = { version = "0.21", optional = true }

[profile.dev]
opt-level = 1
debug = false

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4

[features]
# Support VR (OpenXR : SteamVR + Quest 2 via ALVR/Link). cargo build --release --features vr
vr = ["dep:bevy_mod_openxr", "dep:bevy_mod_xr", "dep:openxr"]
